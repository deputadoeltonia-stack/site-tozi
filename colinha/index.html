<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha colinha de voto</title>
<meta name="description" content="Monte sua colinha de voto para 4 de outubro. Digite os números e confira os nomes antes de ir votar.">
<meta name="robots" content="noindex">
<!-- As tres fontes que a pagina usa, buscadas junto com o CSS em vez de
     depois dele: sem isto so eram descobertas quando uma regra casava, e
     comecavam ~60ms atras. Sao os numeros da urna que trocam de desenho na
     cara de quem ja esta conferindo o voto. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/geometos-black.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/avenir-400.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/avenir-500.woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
  <div class="topo-volta" id="volta-area" hidden>
    <a id="volta" class="volta">
      <svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8 1 L2 8 L8 15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Voltar ao site
    </a>
  </div>
  <div class="topo-int">
    <div class="topo-txt">
      <h1 class="marca">
        <!-- Visto OFICIAL da identidade (ID 26 ELTON p.7), pontos exatos do
             vetor, na proporcao natural 170.7x79.3 — nada de esticar. -->
        <svg class="visto-marca" viewBox="0 0 170.7 79.3" aria-hidden="true">
          <path d="M170.7 0 L93.3 25 L46.5 40.1 L0 25.1 L0 64.3 L6 66.2 L46.5 79.3 L154.6 44.4 L170.7 39.2 Z" fill="currentColor"/>
        </svg>
        <span class="marca-txt">Como votar</span>
      </h1>
      <ol class="passos">
        <li>Digite o número do seu candidato</li>
        <li>Confira o nome e a foto</li>
        <!-- o li e grid: o texto e a tecla precisam vir num item so, senao a
             tecla vira um item de grade sozinha e cai na linha de baixo -->
        <li><span>Aperte <span class="tecla">CONFIRMA</span></span></li>
      </ol>
    </div>
    <div class="selo" id="selo" hidden>
      <span class="selo-cargo" id="selo-cargo"></span>
      <span class="selo-nome" id="selo-nome"></span>
      <span class="selo-numero" id="selo-numero"></span>
    </div>
  </div>
</header>

<main class="folha">

  <!-- Busca do topo: um campo so, numero OU nome, varrendo todos os cargos
       livres de uma vez. O resultado ja diz o cargo; um toque (ou o numero
       completo) preenche o campo certo. Escondida ate os dados carregarem:
       sem dataset nao ha o que buscar. -->
  <div class="busca-geral" id="bg" hidden>
    <div class="bg-caixa">
      <svg class="bg-lupa" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
      </svg>
      <input type="search" id="bg-input" class="bg-input"
             placeholder="Digite o número do seu candidato"
             autocomplete="off" enterkeyhint="search"
             aria-label="Buscar candidato por número ou nome">
      <button type="button" id="bg-limpar" class="bg-x" aria-label="Limpar busca" hidden>✕</button>
    </div>
    <ul id="bg-lista" class="bg-lista" hidden></ul>
  </div>

  <p id="aviso" class="aviso" hidden>
    <span id="aviso-txt"></span>
    <button type="button" id="btn-limpar" class="recomecar">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 12a8.5 8.5 0 1 1-2.8-6.3"/>
        <path d="M20.5 3.2v4.9h-4.9"/>
      </svg>
      Começar de novo
    </button>
  </p>

  <p id="carregando" class="carregando" role="status">Carregando candidatos…</p>

  <noscript>
    <style>#carregando { display: none; }</style>
    <p class="carregando">
      Esta página precisa de JavaScript para buscar os candidatos pelo número.
      Ative o JavaScript e recarregue.
    </p>
  </noscript>

  <form id="colinha" class="colinha" hidden autocomplete="off"></form>

  <p id="erro-geral" class="erro-geral" role="alert" hidden></p>

  <div class="acoes" id="acoes" hidden>
    <button type="button" id="btn-salvar">Salvar imagem</button>
    <button type="button" id="btn-enviar" class="secundario">Compartilhe com amigos</button>
  </div>

  <p class="rodape">
    Confira sempre o número do candidato na urna. Seus dados estão seguros e não são compartilhados com terceiros.
  </p>

  <!-- Razao social + CNPJ da campanha. O texto vem da config do candidato
       (colinha-core.js): o mesmo HTML serve as tres campanhas. -->
  <p class="legal" id="legal" hidden></p>

</main>

<div class="faixa" aria-hidden="true"></div>

<div id="busca" class="busca" hidden role="dialog" aria-modal="true" aria-labelledby="busca-titulo">
  <div class="busca-painel">
    <div class="busca-topo">
      <h2 class="busca-titulo" id="busca-titulo">Buscar candidato</h2>
      <button type="button" id="busca-fechar" class="busca-x" aria-label="Fechar">✕</button>
    </div>
    <input type="search" id="busca-input" class="busca-input"
           placeholder="Digite o nome do candidato" autocomplete="off"
           enterkeyhint="search" aria-label="Nome do candidato">
    <ul id="busca-lista" class="busca-lista"></ul>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
